<!DOCTYPE html>
<html lang="ja">
<a href="/">ホーム</a>

<a href="/problems-page">過去問一覧</a>

<a href="/mypage">マイページ</a>

<a href="/login">ログイン</a>

<a href="/register">新規登録</a>

<a href="/logout">ログアウト</a>
<head>
  <meta charset="UTF-8">
  <title>京大数理工学 凸最適化過去問システム</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      background: #f4f6f8;
      color: #1f2933;
      margin: 0;
      padding: 40px;
    }
    nav, .container {
      max-width: 900px;
      margin: 0 auto;
    }
    nav {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 28px;
    }
    nav a, .language-button {
      background: white;
      color: #2563eb;
      border: 0;
      border-radius: 8px;
      padding: 10px 18px;
      text-decoration: none;
      font: inherit;
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
      cursor: pointer;
    }
    .language-button {
      margin-left: auto;
    }
    .container {
      background: white;
      padding: 48px;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }
    h1 {
      font-size: 52px;
      margin: 0 0 28px;
      line-height: 1.2;
    }
    p {
      font-size: 20px;
      line-height: 1.9;
      color: #444;
      margin-bottom: 20px;
    }
    .button {
      display: inline-block;
      margin-top: 28px;
      padding: 16px 32px;
      background: #2563eb;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
    }
    @media (max-width: 760px) {
      body {
        padding: 18px;
      }
      nav {
        flex-wrap: wrap;
      }
      .language-button {
        margin-left: 0;
      }
      .container {
        padding: 28px;
      }
      h1 {
        font-size: 36px;
      }
      p {
        font-size: 17px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <a href="/" data-i18n="navHome">ホーム</a>
    <a href="/problems-page" data-i18n="navProblems">過去問一覧</a>
    <button id="languageButton" class="language-button" type="button">英語</button>
  </nav>

  <div class="container">
    <h1 data-i18n="title">京大数理工学 凸最適化過去問システム</h1>
    <p data-i18n="lead">
      京都大学大学院 数理工学専攻の凸最適化過去問を，年度・知識点・題型ごとに整理する学習支援サイトです。
    </p>
    <p data-i18n="sublead">
      KKT条件，凸性，ヘッセ行列，双対問題などの知識点から，過去問を検索・復習できます。
    </p>
    <a class="button" href="/problems-page" data-i18n="cta">過去問一覧</a>
  </div>

<script>
let currentLanguage = localStorage.getItem("language") || "ja";

const messages = {
  ja: {
    documentTitle: "京大数理工学 凸最適化過去問システム",
    navHome: "ホーム",
    navProblems: "過去問一覧",
    languageButton: "英語",
    title: "京大数理工学 凸最適化過去問システム",
    lead: "京都大学大学院 数理工学専攻の凸最適化過去問を，年度・知識点・題型ごとに整理する学習支援サイトです。",
    sublead: "KKT条件，凸性，ヘッセ行列，双対問題などの知識点から，過去問を検索・復習できます。",
    cta: "過去問一覧"
  },
  en: {
    documentTitle: "Kyoto Mathematical Engineering Convex Optimization Archive",
    navHome: "Home",
    navProblems: "Problems",
    languageButton: "Japanese",
    title: "Kyoto Mathematical Engineering Convex Optimization Archive",
    lead: "A study support site that organizes Kyoto University Mathematical Engineering convex optimization entrance exam problems by year, topic, and problem type.",
    sublead: "Search and review past problems by topics such as KKT conditions, convexity, Hessian matrices, and duality.",
    cta: "View Problems"
  }
};

function t(key) {
  return messages[currentLanguage][key];
}

function applyLanguage() {
  document.documentElement.lang = currentLanguage;
  document.title = t("documentTitle");
  document.querySelectorAll("[data-i18n]").forEach(element => {
    element.textContent = t(element.dataset.i18n);
  });
  document.getElementById("languageButton").textContent = t("languageButton");
}

document.getElementById("languageButton").addEventListener("click", () => {
  currentLanguage = currentLanguage === "ja" ? "en" : "ja";
  localStorage.setItem("language", currentLanguage);
  applyLanguage();
});

applyLanguage();
</script>
</body>
</html>
