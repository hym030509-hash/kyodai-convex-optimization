<!DOCTYPE html>

<html lang="ja">

<head>

  <meta charset="UTF-8">

  <title>新規登録</title>

  <style>

    body {

      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;

      background: #f4f6f8;

      margin: 0;

      padding: 40px;

      color: #1f2933;

    }

    .auth-card {

      max-width: 420px;

      margin: 100px auto;

      background: white;

      padding: 36px;

      border-radius: 14px;

      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);

    }

    h1 {

      margin-top: 0;

      font-size: 32px;

    }

    input {

      width: 100%;

      box-sizing: border-box;

      padding: 12px 14px;

      margin: 10px 0;

      border: 1px solid #cbd5e1;

      border-radius: 8px;

      font-size: 16px;

    }

    button {

      width: 100%;

      margin-top: 14px;

      padding: 12px;

      background: #2563eb;

      color: white;

      border: none;

      border-radius: 8px;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

    }

    .link {

      margin-top: 18px;

      text-align: center;

    }

    a {

      color: #2563eb;

      font-weight: 700;

      text-decoration: none;

    }

  </style>

</head>

<body>

  <div class="auth-card">

    <h1>新規登録</h1>

    <form method="post" action="/register">

      <input name="username" placeholder="ユーザー名" required>

      <input name="password" type="password" placeholder="パスワード" required>

      <button type="submit">登録する</button>

    </form>

    <div class="link">

      すでにアカウントをお持ちの方は <a href="/login">ログイン</a>

    </div>

  </div>

</body>

</html>
